function door(){
 if(!hasKey){modal('<h2>Terkunci</h2><p>Pintunya digembok. Kuncinya ada di peti kayu, tapi gembok petinya perlu kode 3 angka yang tersebar di taman.</p>');return}

}

 let h='<h2>'+fill(CFG.judulAlbum)+'</h2><div class="fr">';

function pbDraw(n){
 const e=$('#pb');if(!e)return;const x=e.getContext('2d'),m=c;c=x;
 x.fillStyle='#fffaf0';x.fillRect(0,0,200,440);
 for(let i=0;i<3;i++){const y=10+i*135;x.fillStyle=i<n?bg:'#e8e0cc';x.fillRect(10,y,180,125);
  if(i<n){x.font='22px serif';x.fillText(stk,16,y+28);x.fillText(stk,160,y+112);x.save();x.translate(100,y+110);x.scale(1.5,1.5);charAt(0,0,0,i%2?-1:1,i);x.restore()}}
 x.fillStyle='#4a3320';x.font='13px "Pixelify Sans",sans-serif';x.fillText(CFG.nama+' • '+new Date().toLocaleDateString('id-ID'),14,428);
 c=m;
}
function snap(){
 if(snap.b)return;snap.b=1;let i=0;const t=$('#pt');pbDraw(0);
 (function s(){
  if(i>=3){snap.b=0;shotDone=true;t.textContent='Fotonya jadi! Screenshot aja buat disimpan 📸';return}
  let n=3;const k=setInterval(()=>{
   if(!t.isConnected){clearInterval(k);snap.b=0;return}
   t.textContent=n>0?'Siap... '+n:'📸 Klik!';
   if(n--<0){clearInterval(k);i++;pbDraw(i);setTimeout(s,500)}
  },500);
 })();
}
